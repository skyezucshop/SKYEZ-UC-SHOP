<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090b" />
  <title>SKYEZ UC SHOP — Оплата</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .payment-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    .payment-card {
      width: min(620px, 100%);
      background: rgba(15, 17, 21, .94);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 28px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
    }
    .payment-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      font-size: 34px;
    }
    .payment-card h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 44px);
    }
    .payment-card p {
      color: rgba(255,255,255,.68);
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 500px;
    }
    .payment-details {
      text-align: left;
      margin: 24px 0;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.045);
    }
    .payment-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .payment-row:last-child { border-bottom: 0; }
    .payment-row span { color: rgba(255,255,255,.58); }
    .payment-row strong { text-align: right; overflow-wrap: anywhere; }
    .payment-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .payment-status {
      font-weight: 700;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="payment-page">
    <main class="payment-card">
      <div class="payment-icon" id="icon">✓</div>
      <h1 id="title">Возврат с оплаты</h1>
      <div class="payment-status" id="status">Проверяем информацию о заказе…</div>
      <p id="description">
        Не закрывайте страницу. Информация о заказе будет показана ниже.
      </p>

      <div class="payment-details" id="details" hidden>
        <div class="payment-row">
          <span>Пакет</span>
          <strong id="pack">—</strong>
        </div>
        <div class="payment-row">
          <span>Ник</span>
          <strong id="nickname">—</strong>
        </div>
        <div class="payment-row">
          <span>PUBG Mobile ID</span>
          <strong id="playerId">—</strong>
        </div>
        <div class="payment-row">
          <span>ID платежа</span>
          <strong id="paymentId">—</strong>
        </div>
      </div>

      <div class="payment-actions">
        <a class="btn btn-primary" href="./index.html">Вернуться в магазин</a>
        <a class="btn btn-ghost" href="https://t.me/skyezq" target="_blank" rel="noopener noreferrer">
          Поддержка @skyezq ↗
        </a>
      </div>
    </main>
  </div>

  <script>
    const raw = sessionStorage.getItem('skyez_payment');

    if (raw) {
      try {
        const order = JSON.parse(raw);

        document.getElementById('details').hidden = false;
        document.getElementById('pack').textContent = order.pack || '—';
        document.getElementById('nickname').textContent = order.nickname || '—';
        document.getElementById('playerId').textContent = order.playerId || '—';
        document.getElementById('paymentId').textContent = order.paymentId || '—';

        document.getElementById('title').textContent = 'Заказ создан';
        document.getElementById('status').textContent =
          'Оплата возвращает вас в магазин.';
        document.getElementById('description').textContent =
          'Сам факт возврата на эту страницу не является подтверждением успешной оплаты. Статус платежа нужно подтверждать через API/webhook ЮKassa.';
      } catch (e) {
        document.getElementById('status').textContent =
          'Не удалось прочитать данные заказа.';
      }
    } else {
      document.getElementById('title').textContent = 'SKYEZ UC SHOP';
      document.getElementById('status').textContent =
        'Данные заказа не найдены.';
      document.getElementById('description').textContent =
        'Вернитесь в магазин и оформите заказ заново.';
    }
  </script>
</body>
</html>
